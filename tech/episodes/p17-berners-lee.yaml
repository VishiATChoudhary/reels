# tech/p17-berners-lee: Tim Berners-Lee on the proposal his boss Mike Sendall marked "vague but exciting" (CERN, March 1989).
# Two Berners-Lee recordings: TED 2009 (The next web, Long Beach, Feb 2009) and CERN's Web@30 panel (Geneva, 12 Mar 2019).
# "exciting" lands on the drop. Build: python3 tools/reel.py build tech/p17-berners-lee   Render: npm run render -- Tech-P17-Berners-Lee
song: mercy
headline: tim berners-lee's boss wrote three words on the *web*
headline_to: 3
end: b33

sources:
  ted:      {url: "https://www.youtube.com/watch?v=OM6XIICm_qo"}                          # TED, Tim Berners-Lee: The next web (Feb 2009)
  cern:     {url: "https://www.youtube.com/watch?v=pJrAUGpFnPw", section: "10:00-30:00"}   # CERN, 30th Anniversary of the World Wide Web (12 Mar 2019)
  history:  {url: "https://www.youtube.com/watch?v=k0gvAyCubGQ"}                          # CERN, A brief history of the World Wide Web (no-text version)
  vnr2:     {url: "https://www.youtube.com/watch?v=-EikHgFvF-0"}                          # CERN video news release, Web@20 (13 Mar 2009)
  cube:     {url: "https://www.youtube.com/watch?v=TNAS_SX1pgQ"}                          # a NeXTcube booting
  ap19:     {url: "https://www.youtube.com/watch?v=4f1dBRzWIK8"}                          # AP Archive, 30th anniversary of the Web (1990s browsers)
  vague:    {file: "~/shennies/reels/public/tech/p17-berners-lee/raw/vague.mp4"}          # push-in on the original cover, Sendall's note (Commons: Ginevra, centro visitatori del cern, primo server della storia (1989), 02.JPG)
  cover:    {file: "~/shennies/reels/public/tech/p17-berners-lee/raw/cover.mp4"}          # same photo, the whole cover
  server:   {file: "~/shennies/reels/public/tech/p17-berners-lee/raw/server.mp4"}         # Commons: First Web Server.jpg, the NeXT at CERN

voice:
  src: cern
  whisper: [[ted, 39.5, 44.6], [111.0, 115.3], [117.4, 120.1], [132.2, 134.0], [193.7, 200.3], [214.1, 221.4], [ted, 52.2, 59.6], [ted, 75.3, 78.0]]
  climax: {seg: 6, word: exciting}
  segments:
    - [ted, 41.10, 44.45, 0.15]   # I wrote a memo suggesting a global hypertext system
    - [111.10, 115.15, 0.30]      # and dated it March of 1989.
    - [117.55, 120.02, 0.25]      # there wasn't really anybody to give it to,
    - [132.36, 133.80, 0.30]      # and so not much happened to it.  (skips the committees explanation)
    - [193.88, 200.10, 0.30]      # in fact what did happen was that Mike Sendall managed to find a way for me to work on it.
    - [214.28, 219.38, 0.30]      # his copy of it, written on the corner of it in his handwriting, in pencil: vague, but
    - [219.38, 221.30, 0.30]      # CLIMAX: exciting, on the top of the cover.
    - [ted, 52.30, 59.40, 0.30]   # my boss said I could do it on the side, as a sort of a play project, kick the tires of a new computer we'd got.
    - [ted, 75.45, 77.85, 0]      # I wrote the code and put it out there.
  fix: [["sandel", "sendall"], ["concerns", "cern"], ["they bake", "vague"], ["we", "we'd"], ["to try it", ""], ["so so", "so"], ["now", ""]]

shots:
  # hook: Berners-Lee at TED 2009, lip-synced
  - 0       hook       ted@sync       WARM   crop=480:480:85:0
  # build-up: the memo nobody could take anywhere; slow, cold
  - 1.75    worldmap   history@10.5   TEAL
  - s1      memo89     history@111.3  BLEAK  zoom=1.3 origin=50%,20%
  - 5.6     tim19      cern@sync      WARM
  - 8.6     emptyroom  history@41.0   BLEAK
  - s3      printer    history@47.0   COLD
  # turn: Mike Sendall finds a way; the copy with his note
  - s4      tim90      history@32.0   AMBER
  - s4+2.6  tim90b     history@91.5   TEAL
  - s4+3.9  mouse      history@121.2  AMBER  zoom=1.3
  - s5      copy       vnr2@44.5      TEAL
  - s5+0.9  corner     cover@1.0      AMBER
  - s5+2.8  hand       vague@0.0      TEAL
  # riser: cuts tighten into "exciting"
  - b-5     vaguesay   cern@sync      WARM
  - b-3     note1      vague@3.5      AMBER
  - b-2     cover2     cover@4.0      TEAL
  - b-1.5   note2      vague@5.0      AMBER
  - b-1     printed    history@113.0  TEAL
  - b-0.5   note3      vague@6.0      AMBER
  # drop and payoff: vivid, on the beat
  - b0      drop       history@127.0  VIVID  flash
  - b1      note4      vague@5.8      RED
  - b3      cover3     cover@3.0      AMBER
  - s7      boss       history@33.5   TEAL
  - s7+1.55 tim90c     ap19@48.0      VIVID
  - s7+3.1  play       history@75.2   AMBER
  - s7+4.6  cubeon     cube@1.0       COLD
  - s7+6.2  server     server@1.0     VIVID
  - s8      tedcode    ted@sync       WARM   crop=480:480:185:0
  - s8+1.45 publicdom  history@158.0  COLD
  - s8+2.5  tedend     ted@39.3       WARM   crop=480:480:185:0

