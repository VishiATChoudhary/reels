  - b-5     pink       thames@57.0      TEAL
  - b-4     proto      coach@124.8      AMBER
  - b-3     cones      coach@212.0      TEAL
  - b-2     yellow     dc01@102.0       AMBER  crop=900:900:520:90
  - b-1.5   clear2     coach@179.8      TEAL
  - b-1     pink2      thames@76.0      AMBER
  - b-0.5   row        dc01@140.0       TEAL
  # drop and payoff
  - b0      worked     ad93@25.0        VIVID  flash
  - b2      look       thames@58.0      TEAL
  - b5      none       speaker@sync     WARM   crop=700:700:1040:150
  - s8      line       dc01@141.6       VIVID
