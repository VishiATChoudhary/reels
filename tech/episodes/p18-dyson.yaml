  - 7.7     bagdust    coach@113.0      BLEAK
  - s2      sketch     coach@94.0       COLD
  - s3      roof       coach@73.0       BLEAK
  - 13.45   cement     cyclone@14.0     TEAL   crop=900:900:510:180
  # turn: 5,126 failures, the young Dyson and his prototypes
  - s4      young      coach@123.0      AMBER
  - 17.0    numbers    coach@229.1      TEAL
  # riser: cuts tighten into the drop
  - b-9     cardboard  coach@132.0      AMBER
