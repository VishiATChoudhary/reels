    - [18.09, 20.15, 0.30]     # strangers could host other strangers in their homes,
    - [25.98, 29.45, 0.40]     # he said, Brian, I hope that's not the only idea you're working on.
    - [124.22, 131.60, 0.35]   # so now it's late 2008, we're like desperate, we've launched three times, no one's using it. I'm hot gluing cereal boxes in my kitchen.
    - [176.72, 182.48, 0.25]   # But as we're leaving the interview, my roommate Joe hands him a box of Barack Obama cereal
    - [187.08, 188.70, 0.20]   # this is how we funded the company.
    - [189.68, 191.80, 0.35]   # he said, if you can figure out how to get people to pay
    - [191.82, 199.82, 0]      # 40 dollars for a four dollar box of cereal, maybe you will convince them how to sleep in each other's homes. So Y Combinator let us in the program.
