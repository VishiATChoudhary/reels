  - 0       hook       sixty@sync     WARM   zoom=1.3 origin=45%,35%
  # build-up: slow, cold
  - 1.55    fire       fails@180.5    BLEAK
  - b-24    musk_a     sixty@sync     WARM
  - 6.45    omelek     flight4@22.0   COLD   crop=1128:860:396:60
  - b-18    farfail    flight4@43.0   TEAL   crop=1200:820:360:120
  - b-15    debris     sixty@517.5    COLD
  - b-13    hosts      sixty@495.0    BLEAK
  - b-11    musk_b     sixty@sync     WARM
  - b-8     wreck      flight4@141.5  BLEAK
  # turn and riser
