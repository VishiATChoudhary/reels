# tech/p13-spacex: Musk, Falcon 1 reaches orbit on the fourth try (28 Sep 2008). Two Musk recordings: 60 Minutes
# (CBS, 2012, with Scott Pelley) for the hook and the low point; his speech to SpaceX staff in Hawthorne right after
# Flight 4 reached orbit (28 Sep 2008) for the turn, the climax and the payoff. "freakin' awesome" lands on the drop.
# Build: python3 tools/reel.py build tech/p13-spacex   Render: npm run render -- Tech-P13-Spacex
song: savior
headline: elon musk had money for just one more *launch*
headline_to: 3
end: b16

sources:
  sixty:   {url: "https://www.youtube.com/watch?v=23GzpbNUyI4", crop: "1700:940:110:0"}   # 60 Minutes 2012; crop hides the 60 Overtime bug
  speech:  {url: "https://www.youtube.com/watch?v=8FQhtMrUQlE", section: "31:50-35:40"}   # Spacevidcast Flight 4 webcast, Musk to staff
  fails:   {url: "https://www.youtube.com/watch?v=B5UzGrIxha4", crop: "1454:1080:240:0"}   # Falcon 1 flights 1 to 3 (raw replaced with the 1080p download)
  flight4: {url: "https://www.youtube.com/watch?v=mq2hymWPN1I"}                            # SpaceX, Falcon 1 Flight 4 (raw replaced with 1080p)

voice:
  src: sixty
  whisper: [[509.90, 516.50], [speech, 66.40, 71.40], [534.35, 540.45], [speech, 72.40, 75.90], [speech, 52.40, 54.75], [speech, 90.10, 94.90], [speech, 108.85, 111.98]]
  climax: {seg: 5, word: freak}
  segments:
    - [509.95, 516.50, 0.30]          # I don't ever give up. I mean, I'd have to be dead or completely incapacitated.
    - [speech, 66.45, 71.40, 0.30]    # And there are a lot of people that thought we couldn't do it. A lot, actually.
    - [534.40, 540.45, 0.30]          # If that fourth launch hadn't worked, that would have been it. We would have not had the resources to mount a fifth.
    - [speech, 72.45, 75.90, 0.35]    # But, you know, as the saying goes, fourth time's the charm, right?
    - [speech, 52.45, 52.78, 0]       # that was
    - [speech, 52.78, 54.75, 0.30]    # CLIMAX: freakin' awesome. We made orbit.
    - [speech, 90.15, 94.90, 0.30]    # There's only a handful of countries on Earth that have done it. It's normally a country thing, not a company thing.
    - [speech, 108.90, 111.98, 0]     # definitely this is one of the greatest days of my life
  fix: [["can", "couldn't"], ["time to", "time's"], ["it over now", "orbit"]]

shots:
