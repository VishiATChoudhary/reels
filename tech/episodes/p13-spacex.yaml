  - b-4     stages     flight4@106.0  TEAL   crop=1200:840:360:120
  - b-3     control    flight4@115.2  AMBER  crop=960:540:480:270
  - b-2     ready      sixty@478.5    TEAL
  - b-1.5   ignite     sixty@480.0    AMBER
  - b-1     liftph     flight4@100.5  TEAL   crop=1152:878:384:120
  - b-0.5   flame      sixty@481.3    AMBER
  # drop and payoff
  - b0      liftoff    sixty@482.6    VIVID  flash
  - b1      orbit      sixty@532.0    TEAL
  - b3      earth      flight4@126.0  COLD   crop=986:840:466:120
  - b5      cheer      flight4@116.3  AMBER  crop=960:540:480:270
  - b7      crowd      flight4@118.5  RED    crop=1200:776:360:152
  - b9      musk_2008  speech@sync    WARM
