voice:
  src: randolph                   # default source of the segments
  whisper: [[19.4, 24.3], [31.55, 33.9], [122.2, 124.4], [134.8, 140.0], [141.45, 144.3], [145.0, 146.6], [147.2, 149.1], [149.8, 151.2], [152.0, 153.3], [154.4, 157.6], [165.5, 168.1], [168.9, 171.2], [174.7, 177.0], [179.95, 183.6]]
