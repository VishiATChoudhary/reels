  segments:
    - [19.42, 20.27, 0.08]    # Blockbuster
    - [21.05, 21.42, 0.10]    # had
    - [22.05, 24.15, 0.30]    # six billion dollars in revenue.
    - [31.60, 33.55, 0.35]    # so Netflix was nothing to them
    - [122.27, 124.05, 0.30]  # wouldn't it be great if you purchased us?
    - [134.85, 135.68, 0.08]  # and they finally
    - [136.15, 136.62, 0.25]  # said
    - [137.25, 139.75, 0.25]  # so how much do you think we should pay for you?
    - [141.50, 144.05, 0.15]  # So Reed screwed up all of his courage
    - [145.05, 146.42, 0.30]  # and he said
    - [147.25, 148.90, 0.45]  # fifty million dollars.
    - [149.85, 150.95, 0.45]  # You know what they did?
    - [152.05, 153.05, 0.40]  # They laughed at us.
    - [154.45, 157.15, 0.35]  # And the meeting went downhill pretty quickly after that.
    - [165.55, 167.98, 0.25]  # all I could do was say to myself, ugh
    - [168.95, 169.88, 0.35]  # now we're gonna have to
    - [169.88, 170.78, 0.30]  # CLIMAX: kick their ass
    - [174.75, 176.45, 0.30]  # it took us ten years
    - [180.00, 183.15, 0]     # but eventually we drove Blockbuster into bankruptcy.
  fix: [["million and", "million"], ["ah", "ugh"]]                       # whisper mishearings: [["heard words", "real words"]]

